[project]
name = "dataprof-adbc-matrix"
version = "0.1.0"
description = "Compatibility matrix: profiling database query results with dataprof through ADBC"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "dataprof==0.13.0",
    "pyarrow>=18",
    "adbc-driver-manager>=1.3",
    "adbc-driver-sqlite>=1.3",
    "adbc-driver-postgresql>=1.3",
    "duckdb>=2.0.0",
]

[dependency-groups]
dev = [
    "psutil>=7.2.2",
    "pytest>=8",
    "ruff>=0.15",
    "ty>=0.0.91",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ty.environment]
python-version = "3.11"
